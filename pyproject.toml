[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-brain-model-alignment"
version = "0.1.0"
description = "RSA-TCA analysis and EEG time-window tuning for generative language models"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Wenqing Zhou"},
  {name = "Zhejun Zhang"},
  {name = "Shaoting Guo"},
  {name = "Lin Zhang"},
  {name = "Lei Li"},
]
dependencies = [
  "torch>=2.0.0",
  "transformers>=4.30.0,<4.40.0",
  "numpy>=1.23",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "scipy>=1.10",
  "spacy>=3.6,<3.8",
  "sentencepiece>=0.1.99",
  "rouge-score>=0.1.2",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.7",
  "seaborn>=0.12",
]
lora = ["peft>=0.8"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
